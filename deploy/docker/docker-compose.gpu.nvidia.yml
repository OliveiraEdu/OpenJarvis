# NVIDIA GPU override + lean production deployment (host-managed llama.cpp) —
# use STANDALONE (do not merge with docker-compose.yml, which is the ollama
# path):
#
#   docker compose -f deploy/docker/docker-compose.gpu.nvidia.yml up -d --build
#
# - Builds the lean image (Dockerfile.lean, ~1.5 GB). No CUDA inside the
#   container: the inference engine runs on the host via llama-server (managed
#   by scripts/llamaserver.sh), reached at host.docker.internal:8080.
# - Serves the API + pre-built SPA on :9000 (no vite dev server).
# - Mounts the host workspace (OPENJARVIS_WORKSPACE_HOST, see .env.example)
#   at /workspace for agent projects.
# - The NVIDIA device reservation is kept for parity with the legacy
#   deployment; nothing in the image links CUDA today.

services:
  jarvis:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.lean
    image: openjarvis:lean
    ports:
      - "9000:9000"
    environment:
      - OPENJARVIS_API_KEY=${OPENJARVIS_API_KEY:?OPENJARVIS_API_KEY must be set (see .env.example)}
      - OPENJARVIS_WORKSPACE=/workspace
      # Optional Tavily API key — forwarded from deploy/docker/.env (gitignored)
      # for the `web_search` provider "tavily". Empty by default: web_search
      # then runs DuckDuckGo and Tavily is never contacted.
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${OPENJARVIS_WORKSPACE_HOST:?OPENJARVIS_WORKSPACE_HOST must be set (see .env.example)}:/workspace"
      # Persistent Jarvis state (config, memory/knowledge DBs, agents, skills).
      # Without this the state dir is inside the container image layer and is
      # wiped on `docker compose down`/rebuild. Mounted over the container
      # user's $HOME so memory.db / knowledge.db / agents.db survive recreates.
      - "${OPENJARVIS_STATE_HOST:?OPENJARVIS_STATE_HOST must be set (see .env.example)}:/home/openjarvis/.openjarvis"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
